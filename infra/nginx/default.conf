server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Limite de upload compatível com importação múltipla de OCR (40MB)
    client_max_body_size 50M;

    # Arquivos estáticos compilados do Vue 3
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache longo para assets compilados pelo Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Rotas de API, Autenticação Sanctum e Sessão repassadas ao Laravel
    location ~ ^/(api|sanctum|login|logout|register)(/|$) {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTP_HOST $http_host;

        fastcgi_read_timeout 120s;
    }

    # Bloqueia acesso direto a arquivos ocultos (.env, .git)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}