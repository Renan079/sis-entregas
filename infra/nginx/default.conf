server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 40M;

    # Arquivos estáticos compilados do Vue 3
    location / {
        try_files $uri $uri/ /index.html;
    }   

    # Cache longo para assets compilados pelo Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Rotas de API, Autenticação Sanctum e Sessão repassadas ao Laravel
    # API e Sanctum CSRF (sempre vão para o Laravel)
    location ~ ^/(api|sanctum) {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    }

    # Autenticação (GET abre a tela do Vue; POST processa no Laravel)
    location ~ ^/(login|logout|register)$ {
        if ($request_method = GET) {
            rewrite ^ /index.html break;
        }
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    }

    # Bloqueia acesso direto a arquivos ocultos (.env, .git)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}